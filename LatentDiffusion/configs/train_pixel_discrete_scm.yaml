expname: simple_consistency 
imsize: 64
pretrain_path :  
trainer:
  target: pytorch_lightning.Trainer
  params:
    max_epochs: 10
    accelerator: gpu
    devices: 4

model:
  target: main.LatentDiffusion
  params:
    imsize: 64
    channels: 3
    lr: 1e-5
    scheduler: CosineAnnealingLR
    sample_output_dir: "./sample/scm_celeb_config"
    sample_epoch_interval: 1

    noise_scheduler_config:
      target: schedulers.flowmatching.DiscreteFlowMatching
      
    timestep_inverse: True
    vae_config:
      target: vae.VAELegacy

    model_config:
        target: models.dit.DiT
        params:
          in_channels: 3
          pos_emb_type: "learned1d"
          hidden_size: 512
          depth: 12
          num_heads: 8
          mlp_ratio: 4.0 
          learn_sigma: False  
          use_gradient_checkpointing: False 
  
    model_pretrained_path: "logs/discrete_fm/version_0/checkpoints/model-epoch=03-val_loss=0.12274.ckpt"
    loss_type: "simple_consistency_distillation"

data:
  target: data.data_wrapper.CelebDataModule
  params:
    data_dir: nielsr/CelebA-faces
    batch_size: 32
    num_workers: 16
    imsize : 64